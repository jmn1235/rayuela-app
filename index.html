<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rayuela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{
  --crema:#FFF9F0; --tinta:#2E2A45; --tinta-suave:#5B5570;
  --azul:#2E6FA7; --verde-ok:#2E8A6B; --rojo:#C4483A;
  --rosa:#F6A9C1; --amarillo:#FFCB4D; --brote:#7FD1B9; --cielo:#8EC6F0; --violeta:#B79CE8;
  --borde:#E3D9C9; --papel:#FFFFFF;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --cuerpo:"Atkinson Hyperlegible",Verdana,Tahoma,system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
#ray{font-family:var(--cuerpo);color:var(--tinta);background:var(--crema);line-height:1.5;
  font-size:16px;letter-spacing:.01em;padding:0 0 48px;min-height:100vh}
#ray h1,#ray h2,#ray h3{font-family:var(--display);font-weight:600;line-height:1.25;margin:0}
#ray h1{font-size:28px} #ray h2{font-size:22px} #ray h3{font-size:18px}
#ray p{margin:0 0 12px;max-width:68ch}
#ray button{font-family:var(--cuerpo);font-size:16px;cursor:pointer}
#ray :focus-visible{outline:3px solid var(--azul);outline-offset:3px;border-radius:6px}
.wrap{max-width:920px;margin:0 auto;padding:0 20px}
.topbar{background:var(--papel);border-bottom:1px solid var(--borde);padding:14px 0;margin-bottom:28px}
.topbar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.02em}
.brand small{color:var(--tinta-suave);font-size:13px}
.spacer{flex:1}
.btn{border:none;border-radius:999px;padding:14px 24px;background:var(--azul);color:#fff;
  font-weight:700;min-height:48px;display:inline-flex;align-items:center;gap:9px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--azul);border:2px solid var(--azul)}
.btn.quiet{background:transparent;color:var(--tinta-suave);border:2px solid var(--borde)}
.btn.ok{background:var(--verde-ok)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--papel);border:1px solid var(--borde);border-radius:var(--r);padding:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
label{display:block;font-weight:700;margin:0 0 6px;font-size:15px}
.hint{color:var(--tinta-suave);font-size:14px;margin:0 0 10px}
input[type=text],textarea,select{width:100%;font-family:var(--cuerpo);font-size:16px;color:var(--tinta);
  background:var(--papel);border:2px solid var(--borde);border-radius:10px;padding:12px;line-height:1.5}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--azul);outline:none}
.pick{display:grid;gap:12px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--papel);
  border:2px solid var(--borde);border-radius:var(--r);padding:16px;min-height:48px}
.opt:hover{border-color:var(--azul)}
.opt[aria-pressed=true]{border-color:var(--azul);background:#EAF2F9;box-shadow:inset 0 0 0 1px var(--azul)}
.opt .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--borde);flex:none;
  display:grid;place-items:center;font-size:15px;color:transparent;margin-top:2px}
.opt[aria-pressed=true] .tick{border-color:var(--azul);background:var(--azul);color:#fff}
.opt b{display:block;font-size:16px}
.opt span{color:var(--tinta-suave);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--borde);background:var(--papel);border-radius:999px;padding:10px 16px;
  min-height:44px;font-weight:700;color:var(--tinta)}
.chip[aria-pressed=true]{background:var(--azul);color:#fff;border-color:var(--azul)}
.chip.sm{font-weight:400;font-size:14px;padding:8px 14px;min-height:40px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.stepnav{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}
.tag{display:inline-block;background:#F1EDE4;border-radius:999px;padding:4px 12px;font-size:13px;
  color:var(--tinta-suave);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.casilleros{display:flex;align-items:flex-end;gap:8px;justify-content:center;margin:0 0 22px}
.cas{width:60px;height:56px;border:2px solid var(--borde);background:var(--papel);border-radius:8px;
  display:grid;place-items:center;font-family:var(--display);font-weight:600;color:var(--tinta-suave);
  font-size:13px;text-align:center;line-height:1.15;padding:4px;position:relative}
.cas:nth-child(odd){transform:rotate(-1.2deg)} .cas:nth-child(even){transform:rotate(1deg)}
.cas.done{background:#E9F6F1;border-color:var(--brote);color:var(--verde-ok)}
.cas.now{border-color:var(--azul);background:#EAF2F9;color:var(--azul);border-width:3px}
.cas .tz{position:absolute;top:-26px;left:50%;transform:translateX(-50%)}
@media(max-width:620px){.cas{width:46px;height:48px;font-size:11px}}
.act{border:2px solid var(--borde);border-radius:12px;padding:12px 14px;background:var(--papel);
  display:flex;align-items:center;gap:12px;margin-bottom:10px}
.act b{flex:1}
.count{display:flex;align-items:center;gap:8px}
.count button{width:40px;height:40px;border-radius:10px;border:2px solid var(--borde);
  background:var(--papel);font-size:20px;font-weight:700;color:var(--azul);line-height:1}
.count span{min-width:26px;text-align:center;font-weight:700}
.iconbtn{width:40px;height:40px;border-radius:10px;border:2px solid var(--borde);background:var(--papel);
  color:var(--tinta-suave);font-size:16px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 2px var(--borde)}
.sw[aria-pressed=true]{border-color:var(--papel);box-shadow:0 0 0 3px var(--tinta)}
.note{background:#FDF4E3;border:1px solid #F0DDB8;border-radius:12px;padding:14px 16px;font-size:14.5px}
.note.info{background:#EAF2F9;border-color:#C7DDEF}
.note.warn{background:#FBEDEB;border-color:#EFCFCA}
.summary{display:grid;gap:12px}
.sumrow{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--borde);border-radius:12px;
  padding:14px;background:var(--papel)}
.sumrow .ck{color:var(--verde-ok);font-weight:700;font-size:18px;line-height:1.2}
.sumrow small{display:block;color:var(--tinta-suave);font-size:14px}
.doc{background:var(--papel);border:1px solid var(--borde);border-radius:var(--r);padding:34px 38px}
.doc h2{margin:0 0 6px}
.doc .lead{color:var(--tinta-suave);font-size:14px;margin-bottom:20px}
.doc .blk{margin:0 0 18px}
.doc .voc{display:flex;gap:14px;align-items:center;background:#FFF6DF;border-radius:12px;padding:12px 14px;margin:0 0 12px}
.doc .voc img{width:64px;height:64px;object-fit:contain;flex:none;background:#fff;border-radius:8px}
.doc .exline{border-bottom:1.5px dotted #B9B3C4;height:26px;margin:8px 0}
.doc .ilustracionAct{width:100%;max-width:520px;display:block;margin:6px auto 12px;border-radius:16px;
  border:1px solid var(--borde);background:#fff}
.doc svg{max-width:100%;height:auto}
.doc .ficha{margin:0 0 26px}
.doc .claseHead{border-left:4px solid var(--borde);padding:2px 0 2px 14px;margin:0 0 10px;font-size:.92em}
.doc .claseHead p{margin:0 0 3px}
.doc .cierre{margin:8px 0 0;font-size:.95em}
.doc ol,.doc ul{padding-left:22px;margin:8px 0}
.doc li{margin:0 0 8px}
.doc .consigna{font-weight:700}
.pill{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;margin-left:8px;
  background:#EFEBFA;color:#4A3E7A}
.loading{display:grid;place-items:center;gap:16px;padding:52px 20px;text-align:center}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
.hop{animation:hop 1.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.hop{animation:none}}
.hidden{display:none!important}
.perfilcard{border:2px solid var(--borde);border-radius:12px;padding:14px;background:var(--papel);margin-bottom:10px}
.doc[data-size=grande]{font-size:19px} .doc[data-size=muy]{font-size:23px}
.doc[data-lead=amplio]{line-height:1.9}
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="ray">
  <div class="topbar"><div class="wrap">
    <div class="brand" id="brandHome" role="button" tabindex="0">
      <svg width="42" height="42" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="4" y="26" width="17" height="17" rx="3" fill="none" stroke="#2E2A45" stroke-width="2.4" transform="rotate(-3 12 34)"/>
        <rect x="26" y="26" width="17" height="17" rx="3" fill="none" stroke="#2E2A45" stroke-width="2.4" transform="rotate(2 34 34)"/>
        <path d="M11 27C13 12 26 8 33 15" fill="none" stroke="#F6A9C1" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="34" cy="17" r="4.6" fill="#FFCB4D" stroke="#2E2A45" stroke-width="2.2"/>
      </svg>
      <div><b>Rayuela</b><br><small>Contenido que saca barreras</small></div>
    </div>
    <div class="spacer"></div>
    <span id="usuarioActual" class="hint" style="margin:0 4px 0 0"></span>
    <button class="btn quiet hidden" id="navPerfiles">Perfiles de alumnos</button>
    <button class="btn quiet hidden" id="navSalir">Cerrar sesión</button>
  </div></div>

  <main class="wrap">
    <section id="scLogin"></section>
    <section id="scHome" class="hidden"></section>
    <section id="scWizard" class="hidden"></section>
    <section id="scLoad" class="hidden"></section>
    <section id="scDoc" class="hidden"></section>
    <section id="scPerfiles" class="hidden"></section>
  </main>
</div>

<script>
/* ====================== DATOS PEDAGÓGICOS ======================
   Todo lo de acá sale del manual "Todos los niños aprenden",
   del cuadernillo de actividades y del manual de marca Rayuela. */

const NIVELES = [
  {id:"poco", nom:"Poco significativa", sub:"Más accesible, mismo contenido.",
   desc:"Simplifica vocabulario, ordena las consignas y mejora la claridad. No baja el nivel de exigencia ni cambia el objetivo.",
   regla:"Mantené el contenido y el nivel de exigencia intactos. Simplificá vocabulario, acortá oraciones, numerá pasos, una consigna por línea. No elimines información ni conceptos."},
  {id:"signif", nom:"Significativa", sub:"Menor carga cognitiva.",
   desc:"Reformula consignas, reduce pasos complejos y suma apoyos visuales. Actividades más guiadas y directas.",
   regla:"Reformulá consignas a lenguaje directo y literal, reducí la cantidad de pasos, agregá apoyos visuales y ejemplos resueltos. Conservá el objetivo de aprendizaje y los conceptos centrales; podés reducir la cantidad de información secundaria."},
  {id:"muy", nom:"Muy significativa", sub:"Idea simple y concreta.",
   desc:"Trabaja las ideas centrales con lenguaje muy concreto, apoyo visual permanente y respuestas de baja demanda motriz o verbal.",
   regla:"Reducí a 2 o 3 ideas centrales, en oraciones muy cortas y concretas, sin lenguaje figurado. Apoyo visual en cada idea. Ofrecé respuestas de baja demanda (señalar, elegir, unir, completar con una palabra). Nunca infantilices el tono ni las imágenes: la edad cronológica se respeta."}
];

const CONDICIONES = [
  {id:"tea", nom:"TEA (autismo)", ajuste:"Consignas literales, sin lenguaje figurado ni doble negación. Estructura visible: qué hago, cuánto falta, cómo sé que terminé. Modelo terminado a la vista. Anticipar cambios. Usar el interés propio del chico como contexto de los ejemplos."},
  {id:"tdah", nom:"TDAH", ajuste:"Fragmentar en bloques de 5 a 15 minutos con cierre visible. Máximo dos pasos por consigna. Menos ítems por página. Checklist para marcar avance. Feedback inmediato."},
  {id:"dislexia", nom:"Dislexia", ajuste:"Texto en fuente sin serifa, interlineado amplio, sin bloques largos. Nunca penalizar ortografía si no es el objetivo. Ofrecer la opción de escuchar el texto y de responder oralmente. Vocabulario clave destacado con imagen."},
  {id:"discalculia", nom:"Discalculia", ajuste:"Secuencia concreto - pictórico - símbolo. Material manipulable o dibujo antes del número. Menos ítems, más apoyo visual. Tabla de apoyo disponible. Nunca cronometrar el cálculo."},
  {id:"disgrafia", nom:"Disgrafía o dispraxia (TDC)", ajuste:"Reducir la cantidad de escritura, no la calidad de la tarea: textos con huecos, opción múltiple, tarjetas para ordenar. Permitir respuesta oral, dictada o tipeada. Renglones amplios. Nunca copiar del pizarrón en volumen."},
  {id:"tdl", nom:"TDL / TEL (lenguaje)", ajuste:"Oraciones cortas con estructura simple. Vocabulario nuevo explicado con imagen y ejemplo. Consigna dicha y escrita. Dar tiempo extra de procesamiento. Preguntas cerradas antes que abiertas."},
  {id:"intelectual", nom:"Discapacidad intelectual", ajuste:"Menos contenidos con más profundidad. Descomponer en pasos observables. Muchas actividades con la misma consigna para que la energía se use en el contenido. Priorizar lo funcional y transferible. Objetivos en conducta observable."},
  {id:"down", nom:"Síndrome de Down", ajuste:"Entrada visual siempre: la memoria y el procesamiento visual son el punto fuerte. Lectura como vía de acceso al lenguaje. Instrucciones nunca solo orales. Frases cortas apoyadas en imagen."},
  {id:"sordera", nom:"Sordera o hipoacusia", ajuste:"Todo lo oral también escrito o visual. Vocabulario y lenguaje figurado enseñados de forma explícita, no por exposición. No dar por supuestos conocimientos que se adquieren de oído. Apoyo visual en cada consigna."},
  {id:"baja_vision", nom:"Baja visión", ajuste:"Macrotipo (18 pt o más), alto contraste, sin texto sobre imágenes. Gráficos ampliados y simplificados, sin detalle decorativo. Mucho espacio en blanco. Tiempo adicional."},
  {id:"ceguera", nom:"Ceguera", ajuste:"Todo contenido visual necesita descripción verbal completa dentro del texto. Evitar referencias del tipo esto va acá. Preferir consignas resolubles en audio, braille o tecleo. Describir cada imagen en palabras."},
  {id:"motriz", nom:"Discapacidad motriz o PC", ajuste:"Respuestas de baja demanda motriz: señalar, elegir, marcar, dictar. Áreas de respuesta amplias. Menos cantidad de escritura. Permitir apoyo de escriba o computadora."},
  {id:"altas", nom:"Altas capacidades", ajuste:"Compactar lo que ya domina y liberar tiempo para profundizar. Tareas abiertas con producto propio. Preguntas de análisis crítico y creación. Nunca más de lo mismo como premio."},
  {id:"ansiedad", nom:"Ansiedad o trauma", ajuste:"Predictibilidad total: decir de antemano qué viene, cuánto dura y cómo se evalúa. Baja apuesta emocional. Nada de exposición pública ni comparación. Permitir empezar por la parte más fácil."}
];

const CANALES = ["Oral","Visual","Escrito","Gestual","Demostración"];

const AREAS = [
  {id:"lengua", nom:"Prácticas del Lenguaje",
   inneg:"Que construya el sentido del texto y organice ideas propias.",
   negoc:"Si lo lee, lo escucha o lo ve; si escribe a mano, tipea, dicta o graba. La ortografía no se penaliza salvo que sea el objetivo declarado."},
  {id:"mate", nom:"Matemática",
   inneg:"Que elija la operación y justifique; que estime y compare.",
   negoc:"Calculadora, material concreto, cantidad de ítems, formato y tiempo, tabla de apoyo."},
  {id:"naturales", nom:"Ciencias Naturales",
   inneg:"La relación causal del fenómeno; observar, registrar y concluir.",
   negoc:"El formato: oral, esquema, maqueta o audio. El rol dentro del grupo y la forma de registro."},
  {id:"sociales", nom:"Ciencias Sociales",
   inneg:"La secuencia temporal, y las causas y consecuencias del proceso.",
   negoc:"Línea de tiempo ilustrada en vez de texto, cantidad de causas, fuente adaptada o en audio."},
  {id:"etica", nom:"Formación Ética y Ciudadana",
   inneg:"Que tome posición y considere el punto de vista del otro.",
   negoc:"Cómo lo expresa: oral, dibujo, dramatización, elección entre opciones."},
  {id:"artistica", nom:"Educación Artística o Tecnología",
   inneg:"La idea y la intención de la producción.",
   negoc:"Casi todo el formato y los materiales."}
];

const HERRAMIENTAS = [
  {id:"piedra", nom:"La piedra en el estanque", aula:"La palabra que hace olas", desc:"Una palabra al centro genera ondas: rimas, sonidos iguales, palabras parecidas. Ideal para vocabulario y conciencia fonológica."},
  {id:"binomio", nom:"Binomio fantástico", aula:"Las dos palabras que se chocan", desc:"Dos palabras muy distintas unidas por una preposición generan una historia. La herramienta más democrática: solo hace falta saber dos palabras."},
  {id:"hipotesis", nom:"Hipótesis fantástica", aula:"¿Qué pasaría si...?", desc:"Un supuesto absurdo desarrollado con lógica. Enseña razonamiento causal disfrazado de juego."},
  {id:"scamper", nom:"SCAMPER", aula:"La máquina de transformar", desc:"Siete preguntas para modificar cualquier cosa: sustituir, combinar, adaptar, modificar, ponerle otro uso, eliminar, reordenar."},
  {id:"sombreros", nom:"Seis Sombreros", aula:"Los seis anteojos", desc:"Seis formas de mirar lo mismo, una por vez: datos, emociones, riesgos, beneficios, ideas nuevas, organización."},
  {id:"lluvia", nom:"Lluvia de ideas con reglas", aula:"Todas las ideas entran", desc:"Con las cuatro reglas visibles: no se critica, muchas ideas, se aceptan las locas, se puede mejorar la del otro."},
  {id:"brainwriting", nom:"Brainwriting 6-3-5", aula:"La ronda de papeles", desc:"Cada uno escribe o dibuja una idea y la pasa; el que recibe agrega. Participan también los que no hablan en público."},
  {id:"mapa", nom:"Mapa mental", aula:"El árbol de ideas", desc:"Idea central, ramas gruesas, ramitas, color y dibujo. Herramienta creativa y apoyo de accesibilidad a la vez."},
  {id:"disney", nom:"Método Disney", aula:"Los tres rincones", desc:"Soñador, realista y crítico en tres lugares distintos del aula. El movimiento ayuda a cambiar de modo de pensar."},
  {id:"morfologica", nom:"Caja morfológica", aula:"La máquina de combinar", desc:"Una tabla de partes y opciones que se combinan al azar. Infinitas variantes con estructura garantizada."},
  {id:"rutinas", nom:"Rutinas de pensamiento", aula:"Las preguntas de siempre", desc:"Veo - Pienso - Me pregunto; Antes pensaba... ahora pienso. Máximo impacto por minuto invertido."},
  {id:"design", nom:"Design Thinking infantil", aula:"Los cinco pasos del inventor", desc:"Empatizar, definir, idear, prototipar y probar. Ideal para proyectos con destinatario real."}
];

const BANCO = [
  {id:"A1",g:1,her:"piedra",area:"lengua",tit:"El nombre que hace olas",obj:"Identificar el sonido inicial del propio nombre y encontrar palabras que lo compartan.",inneg:"Reconocer y aislar el sonido inicial."},
  {id:"A2",g:1,her:"binomio",area:"lengua",tit:"Dos palabras que se chocan",obj:"Crear una historia breve a partir de dos palabras sin relación.",inneg:"Producir una secuencia narrativa con inicio y final."},
  {id:"A3",g:1,her:"morfologica",area:"naturales",tit:"Inventamos un animal del monte",obj:"Combinar características de animales reales y explicar cómo vive y de qué se alimenta.",inneg:"Relacionar características del animal con su ambiente y su alimentación."},
  {id:"A4",g:1,her:"rutinas",area:"sociales",tit:"Veo, pienso y me pregunto sobre mi barrio",obj:"Describir una imagen del entorno separando lo que se ve de lo que se interpreta.",inneg:"Distinguir observación de interpretación."},
  {id:"A5",g:1,her:"hipotesis",area:"lengua",tit:"Si los objetos del aula hablaran",obj:"Desarrollar consecuencias lógicas a partir de un supuesto imaginario.",inneg:"Encadenar una causa con su consecuencia."},
  {id:"A7",g:1,her:"scamper",area:"mate",tit:"El número escondido",obj:"Transformar cantidades y explicar qué cambió en el número.",inneg:"Comprender que la cantidad cambia al agregar o quitar."},
  {id:"A8",g:1,her:"mapa",area:"naturales",tit:"Mi primer mapa mental",obj:"Organizar en ramas lo que sabemos de un tema con dibujo y palabra.",inneg:"Agrupar información por categorías."},
  {id:"A10",g:1,her:"design",area:"mate",tit:"La caja de los problemas",obj:"Inventar y resolver problemas matemáticos con situaciones reales del aula.",inneg:"Elegir la operación adecuada y justificarla."},
  {id:"B1",g:2,her:"sombreros",area:"etica",tit:"Decidimos qué hacer con el patio",obj:"Analizar una decisión colectiva desde seis puntos de vista distintos.",inneg:"Considerar más de una perspectiva antes de decidir."},

const ICON_KEYS = Object.keys(ICONOS);
function normalizar(s){
  return String(s||"").toLowerCase().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function buscarIcono(palabra){
  const p = normalizar(palabra);
  if(!p) return null;
  for(const k of ICON_KEYS){
    if(ICONOS[k].k.some(v=>normalizar(v)===p)) return k;
  }
  for(const k of ICON_KEYS){
    if(ICONOS[k].k.some(v=>{const n=normalizar(v); return n.length>3 && (p.includes(n)||n.includes(p));})) return k;
  }
  return null;
}
/* Dibuja el ícono; si no está en la librería, cae a un marco con la palabra. */
function icono(palabra, x, y, size){
  const k = buscarIcono(palabra);
  const s = size/100;
  if(k) return '<g transform="translate('+x+','+y+') scale('+s+')">'+ICONOS[k].p+'</g>';
  const w = String(palabra||"").slice(0,12);
  return '<g transform="translate('+x+','+y+')">'+
    '<rect x="'+(size*0.06)+'" y="'+(size*0.12)+'" width="'+(size*0.88)+'" height="'+(size*0.62)+'" rx="'+(size*0.1)+
    '" fill="#FFF9F0" stroke="#2E2A45" stroke-width="3"/>'+
    '<text x="'+(size*0.5)+'" y="'+(size*0.47)+'" text-anchor="middle" font-family="Verdana,sans-serif" font-size="'+(size*0.15)+
    '" fill="#2E2A45">'+esc(w)+'</text></g>';
}

/* ====================== PLANTILLAS VISUALES ======================
   Una función de dibujo por plantilla del manual de recursos visuales.
   Devuelven SVG autocontenido (sin imágenes externas) para que se pueda
   mostrar en pantalla y rasterizar dentro del Word. */
const F = 'font-family="Verdana,Arial,sans-serif"';
function envolver(txt, max){
  const pal = String(txt||"").split(/\s+/); const out=[]; let l="";
  pal.forEach(p=>{ if((l+" "+p).trim().length>max){ out.push(l.trim()); l=p; } else l+=" "+p; });
  if(l.trim()) out.push(l.trim());
  return out;
}
function texto(t,x,y,o){
  o=o||{}; const size=o.size||16, lh=o.lh||size*1.45, max=o.max||60;
  const lineas = envolver(t,max);
  return lineas.map((l,i)=>'<text x="'+x+'" y="'+(y+i*lh)+'" '+F+' font-size="'+size+
    '" fill="'+(o.color||"#2E2A45")+'"'+(o.bold?' font-weight="bold"':'')+
    (o.anchor?' text-anchor="'+o.anchor+'"':'')+'>'+esc(l)+'</text>').join("");
}
function altoTexto(t,max,size,lh){ return envolver(t,max||60).length*(lh||(size||16)*1.45); }
function svgWrap(w,h,inner){
  /* width/height explícitos: sin ellos el SVG rasteriza en blanco al pasarlo al Word */
  /* Sin CSS adentro: 'height:auto' hace que el SVG rasterice en blanco.
     El tamaño responsivo se resuelve desde la hoja de estilos (.doc svg). */
  return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" xmlns="http://www.w3.org/2000/svg">'+
    '<rect width="'+w+'" height="'+h+'" fill="#FFFFFF"/>'+inner+'</svg>';
}
const W = 680;

/* 1. Opción visual: enunciado + alternativas con dibujo para rodear */
function plOpcionVisual(a,col){
  let y = 12, s = "";
  (a.items||[]).forEach((it,i)=>{
    s += texto((i+1)+") "+(it.enunciado||""), 8, y+16, {size:16, max:64});
    y += altoTexto((i+1)+") "+(it.enunciado||""),64,16) + 8;
    const ops = (it.opciones&&it.opciones.length)?it.opciones.slice(0,4):["Verdadero","Falso"];
    const bw = Math.min(150, (W-40)/ops.length);
    ops.forEach((o,j)=>{
      const x = 16 + j*(bw+10);
      s += '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="96" rx="10" fill="#FFF9F0" stroke="'+col+'" stroke-width="2.5"/>';
      s += icono(it.iconos&&it.iconos[j] ? it.iconos[j] : o, x+bw/2-26, y+6, 52);
      s += texto(String(o).slice(0,16), x+bw/2, y+80, {size:13, anchor:"middle", max:18});
    });
    y += 112;
  });
  return svgWrap(W, y+6, s);
}

/* 2. Unir con flechas: dos columnas ilustradas */
function plUnir(a,col){
  const its = (a.items||[]).slice(0,6);
  const fila = 78, h = its.length*fila + 30;
  let s = texto("Uní con una línea", 8, 18, {size:14, color:"#5B5570"});
  its.forEach((it,i)=>{
    const y = 30 + i*fila;
    s += '<rect x="10" y="'+y+'" width="250" height="64" rx="10" fill="#FFF9F0" stroke="#2E2A45" stroke-width="2.5"/>';
    s += icono(it.icono||it.enunciado, 18, y+6, 52);
    s += texto(String(it.enunciado||"").slice(0,26), 80, y+38, {size:15, max:24});
    s += '<circle cx="278" cy="'+(y+32)+'" r="6" fill="'+col+'"/>';
    s += '<circle cx="'+(W-278)+'" cy="'+(y+32)+'" r="6" fill="'+col+'"/>';
    s += '<rect x="'+(W-260)+'" y="'+y+'" width="250" height="64" rx="10" fill="#FFF9F0" stroke="#2E2A45" stroke-width="2.5"/>';
    s += texto(String(it.par||it.respuesta||"").slice(0,26), W-248, y+38, {size:15, max:24});
  });
  return svgWrap(W, h, s);
}

/* 3. Completar con apoyo: hueco + dibujo de la palabra al lado */
function plCompletar(a,col){
  const its = (a.items||[]).slice(0,6);
  let y = 10, s = "";
  if(a.banco&&a.banco.length){
    s += '<rect x="8" y="'+y+'" width="'+(W-16)+'" height="44" rx="10" fill="#FFF6DF" stroke="#FFCB4D" stroke-width="2.5"/>';
    s += texto("Palabras: "+a.banco.join("  ·  "), 20, y+28, {size:15, max:62});
    y += 58;
  }
  its.forEach((it,i)=>{
    s += '<rect x="8" y="'+y+'" width="'+(W-16)+'" height="72" rx="10" fill="#FFFFFF" stroke="#E3D9C9" stroke-width="2"/>';
    s += icono(it.icono||"", W-78, y+8, 56);
    s += texto((i+1)+") "+String(it.enunciado||"").replace(/_+/g,"__________"), 20, y+42, {size:16, max:52});
    y += 82;
  });
  return svgWrap(W, y, s);
}

/* 4. Secuencia para ordenar: viñetas con casillero para numerar */
function plSecuencia(a,col){
  const its = (a.items||[]).slice(0,5);
  const bw = Math.min(160, (W-30)/Math.max(1,its.length));
  let s = "";
  its.forEach((it,i)=>{
    const x = 12 + i*(bw+6);
    s += '<rect x="'+x+'" y="10" width="'+bw+'" height="120" rx="12" fill="#FFF9F0" stroke="#2E2A45" stroke-width="2.5"/>';
    s += icono(it.icono||it.enunciado, x+bw/2-32, 18, 64);
    s += texto(String(it.enunciado||"").slice(0,40), x+bw/2, 96, {size:12, anchor:"middle", max:20});
    s += '<rect x="'+(x+bw/2-20)+'" y="140" width="40" height="40" rx="8" fill="#FFFFFF" stroke="'+col+'" stroke-width="3"/>';
  });
  return svgWrap(W, 192, s);
}

/* 5. Pregunta con ícono + renglones punteados */
function plPregunta(a,col,renglones){
  const its = (a.items||[]).slice(0,6);
  const n = renglones||2;
  let y = 8, s = "";
  its.forEach((it,i)=>{
    s += icono(it.icono||"", 10, y, 46);
    s += texto((i+1)+") "+(it.enunciado||""), 66, y+24, {size:16, max:52});
    y += Math.max(48, altoTexto((i+1)+") "+(it.enunciado||""),52,16)+14);
    for(let k=0;k<n;k++){
      s += '<line x1="66" y1="'+y+'" x2="'+(W-14)+'" y2="'+y+'" stroke="#B9B3C4" stroke-width="2" stroke-dasharray="3 5"/>';
      y += 30;
    }
    y += 14;
  });
  return svgWrap(W, y, s);
}

/* 6. Marco de dibujo */
function plMarcoDibujo(a,col){
  const its = (a.items||[]).slice(0,3);
  let y = 8, s = "";
  its.forEach((it,i)=>{

/* 7. Conteo con clipart: filas de dibujos + casillero de cantidad */
function plConteo(a,col){
  const its = (a.items||[]).slice(0,6);
  let y = 10, s = "";
  its.forEach(it=>{
    const n = Math.max(1, Math.min(10, parseInt(it.cantidad,10)||3));
    const sz = n>7?44:52;
    s += '<rect x="8" y="'+y+'" width="'+(W-16)+'" height="'+(sz+22)+'" rx="10" fill="#FFF9F0" stroke="#E3D9C9" stroke-width="2"/>';
    for(let i=0;i<n;i++) s += icono(it.icono||"circulo", 18+i*(sz+4), y+11, sz);
    s += '<rect x="'+(W-72)+'" y="'+(y+11)+'" width="'+sz+'" height="'+sz+'" rx="8" fill="#FFFFFF" stroke="'+col+'" stroke-width="3"/>';
    y += sz+32;
  });
  s += texto("Contá los dibujos y escribí cuántos hay.", 10, y+8, {size:14, color:"#5B5570"});
  return svgWrap(W, y+18, s);
}

/* 8. Trazado grande: glifo punteado + punto de inicio + referentes */
function plTrazado(a,col){
  const it = (a.items||[])[0] || {};
  const glifo = String(it.letra||it.enunciado||"A").trim().slice(0,2).toUpperCase();
  const n = Math.max(0, Math.min(6, parseInt(it.cantidad,10)||3));

  s += '<circle cx="'+(W/2-70)+'" cy="55" r="9" fill="'+col+'"/>';
  for(let i=0;i<n;i++){
    const lado = i%2===0 ? 40 : W-100;
    s += icono(it.icono||"estrella", lado, 40+Math.floor(i/2)*80, 60);
  }
  s += texto("Trazá sobre las líneas punteadas. Empezá por el punto de color.", 10, 258, {size:14, color:"#5B5570"});
  return svgWrap(W, 274, s);

/* 10. Operación con conteo */
function plOperacion(a,col){
  const its = (a.items||[]).slice(0,5);
  let y = 10, s = "";
  its.forEach(it=>{
    const n1 = Math.max(1,Math.min(9,parseInt(it.cantidad,10)||2));
    const n2 = Math.max(1,Math.min(9,parseInt(it.cantidad2,10)||2));

/* 11. Constelación de puntos (patrón tipo dado) */
function PUNTOS(n,x,y,sz){
  const pos = {1:[[.5,.5]],2:[[.28,.28],[.72,.72]],3:[[.25,.25],[.5,.5],[.75,.75]],
    4:[[.28,.28],[.72,.28],[.28,.72],[.72,.72]],5:[[.28,.28],[.72,.28],[.5,.5],[.28,.72],[.72,.72]],
    6:[[.28,.24],[.72,.24],[.28,.5],[.72,.5],[.28,.76],[.72,.76]]};
  const p = pos[Math.max(1,Math.min(6,n))]||pos[6];
  return '<rect x="'+x+'" y="'+y+'" width="'+sz+'" height="'+sz+'" rx="10" fill="#FFFFFF" stroke="#2E2A45" stroke-width="3"/>'+
    p.map(c=>'<circle cx="'+(x+c[0]*sz)+'" cy="'+(y+c[1]*sz)+'" r="'+(sz*0.09)+'" fill="#2E2A45"/>').join("");
}
function plPuntos(a,col){
  const its = (a.items||[]).slice(0,5);
  let y = 10, s = "";
  its.forEach(it=>{
    const n1 = parseInt(it.cantidad,10)||2, n2 = parseInt(it.cantidad2,10)||3;
    s += PUNTOS(n1, 20, y, 64);
    s += '<text x="100" y="'+(y+42)+'" '+F+' font-size="30" font-weight="bold" fill="'+col+'">+</text>';
    s += PUNTOS(n2, 134, y, 64);
    s += '<text x="214" y="'+(y+42)+'" '+F+' font-size="30" font-weight="bold" fill="'+col+'">=</text>';
    s += '<rect x="250" y="'+(y+10)+'" width="46" height="46" rx="8" fill="#FFFFFF" stroke="'+col+'" stroke-width="3"/>';
    y += 78;
  });
  s += texto("Contá los puntos de un vistazo, sin señalar de a uno.", 10, y+6, {size:14, color:"#5B5570"});
  return svgWrap(W, y+16, s);
}

/* 12. Arreglo multiplicativo: filas x columnas */
function plArreglo(a,col){
  const its = (a.items||[]).slice(0,3);
  let y = 10, s = "";
  its.forEach(it=>{
    const f = Math.max(1,Math.min(6,parseInt(it.filas,10)||3));
    const c = Math.max(1,Math.min(8,parseInt(it.columnas,10)||4));
    const sz = 40;
    for(let i=0;i<f;i++) for(let j=0;j<c;j++) s += icono(it.icono||"circulo", 20+j*(sz+4), y+i*(sz+4), sz);
    const bx = 20+c*(sz+4)+20;
    s += '<text x="'+bx+'" y="'+(y+f*(sz+4)/2+8)+'" '+F+' font-size="24" font-weight="bold" fill="'+col+'">'+
         f+' × '+c+' =</text>';
    s += '<rect x="'+(bx+108)+'" y="'+(y+f*(sz+4)/2-22)+'" width="52" height="46" rx="8" fill="#FFFFFF" stroke="'+col+'" stroke-width="3"/>';
    y += f*(sz+4)+26;
  });
  return svgWrap(W, y, s);
}

/* 13. Texto enmarcado para rodear palabras */
function plTextoEnmarcado(a,col){
  const t = (a.items||[]).map(i=>i.enunciado||"").join(" ") || a.consigna || "";
  const lineas = envolver(t, 52);
  const h = lineas.length*30 + 40;
  let s = '<rect x="8" y="8" width="'+(W-16)+'" height="'+h+'" rx="14" fill="#FFF9F0" stroke="'+col+'" stroke-width="4"/>';
  s += lineas.map((l,i)=>'<text x="28" y="'+(44+i*30)+'" '+F+' font-size="19" fill="#2E2A45">'+esc(l)+'</text>').join("");
  return svgWrap(W, h+22, s);
}

/* Dispatcher */
function svgActividad(a,col){
  const p = a.plantilla || plantillaDe(a.tipo);
  try{
    switch(p){
      case "opcion-visual": return plOpcionVisual(a,col);
      case "unir-con-flechas": return plUnir(a,col);
      case "completar-con-apoyo": return plCompletar(a,col);
      case "secuencia-para-ordenar": return plSecuencia(a,col);
      case "marco-dibujo": return plMarcoDibujo(a,col);
      case "conteo-clipart": return plConteo(a,col);
      case "trazado-grande": return plTrazado(a,col);
      case "clasificar-tabla": return plClasificar(a,col);
      case "operacion-con-conteo": return plOperacion(a,col);
      case "constelacion-puntos": return plPuntos(a,col);
      case "arreglo-multiplicativo": return plArreglo(a,col);
      case "texto-enmarcado": return plTextoEnmarcado(a,col);
      default: return plPregunta(a,col, a.tipo==="escritura"?4:2);
    }
  }catch(e){ return plPregunta(a,col,2); }
}

   Una por actividad, nunca por adelantado. Mientras esto no esté configurado
   con la URL real de la función de Firebase, la app sigue funcionando con
   los íconos propios simples como respaldo automático — no se rompe nada. */
const FN_BASE = "https://us-central1-rayuela-app-279da.cloudfunctions.net";
const IMG_FN_URL = FN_BASE+"/generarIlustracion";
const TXT_FN_URL = FN_BASE+"/generarTexto";
const IMG_MAX_POR_MATERIAL = 10; /* tope de imágenes reales por generación (vocabulario + actividades comparten este cupo) */
async function hashTexto(t){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,24);
}
let ULTIMO_ERROR_IMG = "";
async function ilustracionCacheada(escena){
  const clave = "rayuela:ilustracion:"+await hashTexto(escena);
  try{ const v = localStorage.getItem(clave); if(v) return v; }catch(e){}
  if(!IMG_FN_URL){ ULTIMO_ERROR_IMG = "IMG_FN_URL está vacío"; return null; }
  try{
    const token = await tokenActual();
    const res = await fetch(IMG_FN_URL,{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
      body: JSON.stringify({prompt:escena})});
    let data = null;
    try{ data = await res.json(); }catch(e2){ ULTIMO_ERROR_IMG = "Respuesta no-JSON, HTTP "+res.status; return null; }
    if(!res.ok || !data.ok || !data.image){ ULTIMO_ERROR_IMG = "HTTP "+res.status+" — "+(data&&data.error?data.error:"sin detalle"); return null; }
    try{ localStorage.setItem(clave, data.image); }catch(e){ /* localStorage lleno: sigue sin cachear */ }
    return data.image;
  }catch(e){ ULTIMO_ERROR_IMG = "fetch falló: "+e.message; return null; }
}

   Texto, Word, PDF o foto. Los escaneos y las imágenes se transcriben
   con la misma IA, leyendo la hoja como la leería una persona. */
function estadoImport(t){ const e=$("estadoImport"); if(e) e.textContent=t; }
function galeriaFuente(){

function leerComoDataURL(f){
  return new Promise((ok,fail)=>{ const r=new FileReader();
    r.onload=()=>ok(String(r.result||"")); r.onerror=()=>fail(new Error("No se pudo leer el archivo")); r.readAsDataURL(f); });
}
function cargarScript(url, chequeo){
  if(chequeo()) return Promise.resolve();
  return new Promise((ok,fail)=>{
    const sc=document.createElement("script"); sc.src=url;
    sc.onload=()=> chequeo()?ok():fail(new Error("no cargó"));
    sc.onerror=()=>fail(new Error("no cargó"));
    document.head.appendChild(sc);
    setTimeout(()=>{ chequeo()?ok():fail(new Error("no cargó")); },12000);
  });
}
/* Un .docx es un zip: leemos word/document.xml y sacamos el texto de los párrafos. */
async function leerDocx(f){
  const JSZ = await cargarJSZip();
  const zip = await JSZ.loadAsync(f);
  const arch = zip.file("word/document.xml");
  if(!arch) throw new Error("El archivo de Word no tiene el formato esperado.");
  const xml = await arch.async("string");
  const texto = xml.replace(/<w:p[ >]/g,"\n<w:p ").replace(/<w:tab[^>]*>/g," ")
    .replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")
    .replace(/&quot;/g,'"').replace(/&apos;/g,"'")
    .split("\n").map(l=>l.trim()).filter(Boolean).join("\n").slice(0,20000);
  /* Un .docx es un zip: las imágenes pegadas por la docente viven sueltas en
     word/media/. Antes se perdían por completo — ahora se conservan. */
  const sourceImages = [];
  const nombresMedia = Object.keys(zip.files).filter(n=>/^word\/media\//i.test(n) && /\.(png|jpe?g|gif|bmp|webp)$/i.test(n));
  for(const nombre of nombresMedia.slice(0,12)){
    try{
      const ext = (nombre.split(".").pop()||"png").toLowerCase().replace("jpg","jpeg");
      const b64 = await zip.file(nombre).async("base64");
      sourceImages.push({data:"data:image/"+ext+";base64,"+b64, title:nombre.split("/").pop()});
    }catch(e){}
  }
  return {texto, sourceImages};
}
/* Transcribe imágenes usando la visión del modelo. */
async function transcribirImagenes(dataUrls){
  let salida = [];
  for(let i=0;i<dataUrls.length;i++){
    const du = dataUrls[i];
    const m = /^data:([^;]+);base64,(.*)$/.exec(du);
    if(!m) continue;
    estadoImport("Transcribiendo la página "+(i+1)+" de "+dataUrls.length+"...");
    const tokenT = await tokenActual();
    const res = await fetch(TXT_FN_URL,{
      method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+tokenT},
      body: JSON.stringify({ content:[
          {type:"image", source:{type:"base64", media_type:m[1], data:m[2]}},
          {type:"text", text:"Transcribí todo el texto de esta hoja de trabajo escolar, respetando el orden y las consignas numeradas. Si hay dibujos importantes, describilos entre corchetes en una línea, por ejemplo [dibujo de una manzana]. No agregues comentarios propios."}
        ] })
    });
    let data = null;
    try{ data = await res.json(); }catch(e){}
    if(!res.ok || !data || !data.ok) throw new Error((data&&data.error)||"No se pudo transcribir la imagen.");
    salida.push((data.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("\n"));
  }
  return salida.join("\n\n");
}
async function leerPdf(f){
  const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  await cargarScript(base+"pdf.min.js", ()=>window.pdfjsLib);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = base+"pdf.worker.min.js";
  const buf = await f.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
  const paginas = Math.min(pdf.numPages, 10);
  let texto = "";
  for(let i=1;i<=paginas;i++){
    estadoImport("Leyendo la página "+i+" de "+paginas+"...");
    const pg = await pdf.getPage(i);
    const tc = await pg.getTextContent();
    texto += tc.items.map(x=>x.str).join(" ")+"\n\n";
  }
  /* Siempre se conserva también la imagen de cada página (hasta 6): un PDF
     con dibujos y diagramas antes se reducía solo a su capa de texto y esos
     dibujos se perdían aunque el PDF no fuera un escaneo. */
  const sourceImages = [];
  const paginasImg = Math.min(pdf.numPages, 6);
  for(let i=1;i<=paginasImg;i++){
    estadoImport("Guardando la imagen de la página "+i+" de "+paginasImg+"...");
    const pg = await pdf.getPage(i);
    const vp = pg.getViewport({scale:1.5});
    const cv = document.createElement("canvas");
    cv.width = vp.width; cv.height = vp.height;
    await pg.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise;
    sourceImages.push({data:cv.toDataURL("image/jpeg",0.85), title:"Página "+i});
  }
  if(texto.replace(/\s/g,"").length > 200) return {texto:texto.slice(0,20000), sourceImages};
  /* PDF escaneado: no tiene capa de texto, lo pasamos por visión */
  estadoImport("El PDF es una imagen escaneada: se va a transcribir...");
  const transcripcion = await transcribirImagenes(sourceImages.map(x=>x.data));
  return {texto:transcripcion, sourceImages};
}
async function importarArchivo(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  const nom = f.name.toLowerCase();
  if(f.size > 25*1024*1024){ estadoImport("El archivo es muy grande (máximo 25 MB)."); return; }
  estadoImport("Leyendo "+f.name+"...");
  try{
    let texto = "", sourceImages = [];
    if(/\.txt$/.test(nom) || f.type==="text/plain") texto = (await f.text()).slice(0,20000);
    else if(/\.docx$/.test(nom)){ const r = await leerDocx(f); texto=r.texto; sourceImages=r.sourceImages; }
    else if(/\.pdf$/.test(nom)){ const r = await leerPdf(f); texto=r.texto; sourceImages=r.sourceImages; }
    else if(/^image\//.test(f.type)){ const du = await leerComoDataURL(f); texto = await transcribirImagenes([du]); sourceImages=[{data:du,title:f.name}]; }
    else if(/\.doc$/.test(nom)) throw new Error("Los .doc viejos no se pueden leer. Abrilo en Word y guardalo como .docx.");
    else throw new Error("Formato no reconocido. Probá con Word, PDF, imagen o texto.");
    if(!texto || texto.replace(/\s/g,"").length < 20) throw new Error("No se encontró texto en el archivo. Si es una foto, probá con una más nítida.");
    S.texto = texto; S.archivo = f.name; S.sourceImages = sourceImages; renderWizard();
    estadoImport("Cargado: "+f.name+" · "+texto.length+" caracteres"+
      (sourceImages.length?" · "+sourceImages.length+" imagen(es) conservada(s)":"")+". Revisá antes de seguir.");
  }catch(e){
    estadoImport("No se pudo importar: "+e.message);
  }
}

    ${fila("Formato", "Letra "+(S.tamano==="muy"?"macrotipo":S.tamano)+" · interlineado "+S.interlineado+" · énfasis "+esc(byId(COLORES_ENFASIS,S.colorEnf).nom)+

function reglasPedagogicas(){
  const n = byId(NIVELES,S.nivel), a = byId(AREAS,S.area), c = byId(COGNITIVO,S.cognitivo);
  const p = S.perfiles.find(x=>x.id===S.perfilId);
  let r = [];
  r.push("Sos un equipo de maestra de grado y maestra de apoyo a la inclusión de primaria argentina. Diseñás material para "+S.grado+".º grado, área "+a.nom+".");
  r.push("MARCO: Resolución CFE 311/16 y Diseño Universal para el Aprendizaje. Adaptar es sacar barreras, nunca bajar la vara. Se ajusta la dificultad, no la dignidad.");
  r.push("INNEGOCIABLE del área: "+a.inneg+" NEGOCIABLE: "+a.negoc);
  if(S.soloTranscribir) r.push("MODO: solo transcribir. Conservá el contenido tal cual, solo mejorá el formato, la segmentación y la claridad tipográfica. No reformules ideas ni cambies el vocabulario.");
  else r.push("NIVEL DE ADECUACIÓN ("+n.nom+"): "+n.regla);
  r.push("NIVEL COGNITIVO DE LAS ACTIVIDADES ("+c.nom+"): "+c.regla+" Este eje es independiente de la adecuación del texto: aunque el texto esté muy simplificado, las preguntas mantienen este nivel de exigencia.");
  if(p){
    r.push("ALUMNO: "+p.nombre+", "+p.grado+".º grado. Comprende mejor por vía "+p.canal+".");
    if(p.desregula) r.push("Lo desregula: "+p.desregula+".");
    if(p.ayuda) r.push("Lo que lo ayuda: "+p.ayuda+".");
    if(p.ajustes) r.push("Ajustes que ya funcionan: "+p.ajustes+".");
  } else r.push("Vía de comprensión preferente: "+S.canal+".");
  S.condiciones.forEach(id=>{ const x=byId(CONDICIONES,id); r.push("AJUSTE POR "+x.nom.toUpperCase()+": "+x.ajuste); });
  r.push("REGLAS DE ESCRITURA: oraciones cortas, una idea por bloque, una consigna por línea, verbo de acción al principio ('Escribí', 'Marcá', 'Uní'). Vocabulario concreto. Nunca lenguaje figurado no explicado, ironía, doble negación ni condicionales encadenados. Español rioplatense con voseo. Nunca infantilices: respetá la edad cronológica aunque el nivel de lectura sea menor.");
  r.push("NUNCA compares al chico con otros, ni uses lástima ni heroísmo. Nada de 'a pesar de su dificultad'.");
  if(S.instrucciones.trim()) r.push("INDICACIONES DE LA DOCENTE (tienen prioridad): "+S.instrucciones.trim());
  return r.join("\n");
}
function contenidoFuente(){
  if(S.modo==="adaptar") return "TEXTO ORIGINAL A ADAPTAR:\n\n"+S.texto.trim().slice(0,9000);
  const b = byId(BANCO,S.bancoId), h = byId(HERRAMIENTAS,S.herramienta);
  let t = "CREAR CONTENIDO NUEVO sobre el tema: "+(S.tema||b&&b.tit||"")+".";
  if(h) t += "\nHerramienta creativa que estructura la propuesta: "+h.nom+" ("+h.aula+"). "+h.desc;
  if(b) t += "\nBasado en la actividad "+b.id+" del cuadernillo: "+b.tit+". Objetivo: "+b.obj+". Innegociable: "+b.inneg;
  t += "\nLa creatividad necesita bordes: la consigna debe ser específica y con estructura, nunca abierta del tipo 'inventá algo'.";
  return t;
}
async function llamar(sistema, usuario, imagenes){
  const content = [];
  (imagenes||[]).slice(0,4).forEach(du=>{
    const m = /^data:([^;]+);base64,(.*)$/.exec(du||"");
    if(m) content.push({type:"image", source:{type:"base64", media_type:m[1], data:m[2]}});
  });
  content.push({type:"text", text: sistema+"\n\n"+usuario});
  /* Fuera de Claude no hay una cuenta "de fondo" pagando el texto: pasa por
     nuestro propio backend, que tiene la clave de Anthropic guardada. */
  const token = await tokenActual();
  const res = await fetch(TXT_FN_URL,{
    method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
    body: JSON.stringify({content})
  });
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok || !data || !data.ok) throw new Error((data&&data.error)||"La generación no respondió. Probá de nuevo en un momento.");
  return (data.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("\n");
}
function parseJSON(txt){
  let t = String(txt||"").replace(/```json|```/g,"").trim();
  const i = t.indexOf("{"); if(i>0) t = t.slice(i);
  try{ return JSON.parse(t); }catch(e){}
  const j = t.lastIndexOf("}");
  if(j>0){ try{ return JSON.parse(t.slice(0,j+1)); }catch(e){} }
  throw new Error("La respuesta llegó incompleta. Probá generar de nuevo con menos ejercicios.");
}

function pantallaCarga(){
  go("scLoad");
  $("scLoad").innerHTML = '<div class="card"><div class="loading"><div class="hop">'+tiza(78)+'</div>'+
    '<h2 id="msgCarga">Leyendo el material con ojos de maestra...</h2>'+
    '<p class="hint" style="max-width:44ch">Tiza va armando el material en varias pasadas cortas, para que ninguna se corte a la mitad.</p></div></div>';
  return null;
}
/* Cada llamada al modelo dentro del artefacto devuelve como máximo 1000 tokens,
   así que en vez de pedir todo el documento junto, lo pedimos en piezas chicas:
   una para el texto, una para el vocabulario, una por cada tipo de actividad
   y una para las rutas. Así ninguna respuesta corre riesgo de cortarse a la mitad. */
async function llamarJSON(reglas, instruccion, formato, notas, imagenes){
  const usuario = instruccion+"\n\nDevolvé SOLO un objeto JSON válido, sin texto antes ni después, con esta forma exacta:\n"+formato+"\n"+(notas||"");
  try{ return parseJSON(await llamar(reglas, usuario, imagenes)); }
  catch(e){
    return parseJSON(await llamar(reglas, usuario+"\nMuy importante: sé breve, no te acerques al límite de longitud.", imagenes));
  }
}
async function generarTexto(reglas){
  const formato = '{"titulo":"","contenido":"el contenido curricular, ej: Numeración: el 7","objetivo":"un objetivo con verbo observable","innegociable":"lo que sí o sí tiene que aprender",'+
    '"texto":[{"tipo":"subtitulo|parrafo","contenido":""}],'+
    '"docente":{"evidencia":"qué acepto como prueba de que aprendió","alternativa":"qué evidencia alternativa vale para quien no puede producir la principal","tiempo":"duración estimada"}}';
  /* Si el material original tiene imágenes conservadas (Word/PDF/foto), se las
     mostramos de verdad al modelo — no solo la transcripción de texto. */
  const imgs = (S.modo==="adaptar" && S.sourceImages && S.sourceImages.length) ? S.sourceImages.map(x=>x.data) : null;
  return await llamarJSON(reglas, contenidoFuente(), formato,
    "Máximo 4 bloques de texto, cada uno de no más de 3 líneas. Sin markdown dentro de los valores. Sé breve.", imgs);
}
async function generarVocabulario(reglas, resumen){
  const formato = '{"vocabulario":[{"palabra":"","significado":"explicación en una oración corta","picto":"un sustantivo simple y concreto para buscar el pictograma"}]}';
  const r = await llamarJSON(reglas, "CONTENIDO ADAPTADO:\n"+resumen, formato, "Máximo 3 palabras clave. Sin markdown.");
  return r.vocabulario||[];
}
/* Cada plantilla visual necesita datos distintos: no alcanza con el enunciado,
   hay que pedirle a la IA el ícono concreto a dibujar y las cantidades. */
const LISTA_ICONOS = "manzana, pera, uva, banana, estrella, corazon, pelota, sol, luna, nube, casa, arbol, flor, pez, gato, pajaro, mariposa, auto, libro, lapiz, globo, taza, reloj, persona, cuadrado, circulo, triangulo";
function formatoDe(tipo){
  const ic = '"icono":"un sustantivo concreto de esta lista: '+LISTA_ICONOS+'"';
  switch(plantillaDe(tipo)){
    case "opcion-visual":
      return '{"consigna":"","items":[{"enunciado":"","opciones":["",""],"iconos":["un sustantivo de la lista por cada opción",""]}]}';
    case "unir-con-flechas":
      return '{"consigna":"","items":[{"enunciado":"lo que va a la izquierda",'+ic+',"par":"lo que va a la derecha"}]}';
    case "completar-con-apoyo":
      return '{"consigna":"","banco":["palabra1","palabra2"],"items":[{"enunciado":"oración con un hueco marcado ___",'+ic+'}]}';
    case "secuencia-para-ordenar":
      return '{"consigna":"","items":[{"enunciado":"paso muy corto, máximo 5 palabras",'+ic+'}]}';
    case "conteo-clipart":
      return '{"consigna":"","items":[{'+ic+',"cantidad":5}]}';
    case "trazado-grande":
      return '{"consigna":"","items":[{"letra":"la letra o número a trazar, un solo carácter",'+ic+',"cantidad":4}]}';
    case "clasificar-tabla":
      return '{"consigna":"","columnaA":"criterio de la izquierda","columnaB":"criterio de la derecha","items":[{"enunciado":"palabra corta",'+ic+'}]}';
    case "operacion-con-conteo":
      return '{"consigna":"","items":[{'+ic+',"cantidad":3,"cantidad2":2,"signo":"+"}]}';
    case "constelacion-puntos":
      return '{"consigna":"","items":[{"cantidad":4,"cantidad2":3}]}';
    case "arreglo-multiplicativo":
      return '{"consigna":"","items":[{'+ic+',"filas":3,"columnas":4}]}';
    case "texto-enmarcado":
      return '{"consigna":"consigna de qué rodear o subrayar","items":[{"enunciado":"el texto corto completo, 3 a 5 líneas"}]}';
    case "marco-dibujo":
      return '{"consigna":"","items":[{"enunciado":"qué tiene que dibujar",'+ic+'}]}';
    default:
      return '{"consigna":"","items":[{"enunciado":"",'+ic+'}]}';
  }
}
async function generarActividadTipo(reglas, resumen, act){
  const t = byId(TIPOS_ACT, act.tipo);
  let formato = formatoDe(act.tipo);
  /* Una sola escena por actividad, no por ítem: es lo que se manda a ilustrar. */
  formato = formato.replace(/^\{/, '{"escena":"descripción muy visual y concreta de UNA escena que ilustre toda la actividad: qué objetos concretos aparecen, cuántos, cómo están dispuestos, sin decir nombres de letras ni números sueltos",');
  if(S.claseCompleta){
    formato = formato.replace(/^\{/, '{"tema":"nombre corto de la clase","motivacion":"cómo se presenta el tema, una línea",'+
      '"cierre":"una acción de cierre por un canal distinto al del desarrollo: pizarra, plastilina, decir en voz alta, dictado",');
  }
  const instruccion = "CONTENIDO ADAPTADO (base para los ejercicios):\n"+resumen+
    "\n\nGenerá exactamente "+act.cant+" ejercicios de tipo '"+t.nom+"' ("+t.desc+")."+
    "\nEl campo icono (si lo pide el formato) debe ser SIEMPRE un sustantivo concreto y dibujable de la lista dada."+
    "\nEl campo escena es lo más importante: va a producir la ilustración principal que ve la alumna, tiene que ser rica en detalle concreto (no 'una fruta', sí 'una manzana roja grande y una banana amarilla, una al lado de la otra, sobre una mesa de madera').";
  const r = await llamarJSON(reglas, instruccion, formato,
    "Enunciados muy cortos. Sin markdown. Las cantidades son números enteros del 1 al 9.");
  const act2 = {tipo:act.tipo, plantilla:plantillaDe(act.tipo), consigna:r.consigna||t.nom,
          banco:r.banco||[], columnaA:r.columnaA, columnaB:r.columnaB,
          tema:r.tema, motivacion:r.motivacion, cierre:r.cierre, escena:r.escena||"",
          items:(r.items||[]).slice(0, Math.max(1,act.cant))};
  if(r.escena){
    act2.img = await generarIlustracionParaActividad(r.escena);
    if(!act2.img) act2.imgError = ULTIMO_ERROR_IMG || "sin ilustración (motivo desconocido)";
  }
  return act2;
}
/* Respeta el tope por material: si ya se pidieron demasiadas imágenes reales
   en esta generación, las actividades que siguen usan el ícono propio como
   respaldo — nunca se corta la app, solo baja de "ilustración real" a "ícono". */
async function generarIlustracionParaActividad(escena){
  if(!IMG_FN_URL) return null;
  S._imgsGeneradas = S._imgsGeneradas||0;
  if(S._imgsGeneradas >= IMG_MAX_POR_MATERIAL) return null;
  const img = await ilustracionCacheada(escena);
  if(img) S._imgsGeneradas++;
  return img;
}
async function generarRutas(reglas, resumen){
  const formato = '{"a":"la versión más guiada de la misma tarea","b":"la versión intermedia","c":"la versión más autónoma"}';
  return await llamarJSON(reglas,
    "CONTENIDO ADAPTADO:\n"+resumen+"\n\nDescribí en una sola oración cada ruta (A, B y C): misma tarea, mismo objetivo, distinto nivel de exigencia.",
    formato, "Una oración por ruta. Sin markdown.");
}
async function generar(){
  S._imgsGeneradas = 0; /* tope de ilustraciones reales por material, no acumulado entre materiales */
  const timer = pantallaCarga();
  const paso = (t)=>{ const m=$("msgCarga"); if(m) m.textContent=t; };
  try{
    const reglas = reglasPedagogicas();
    paso("Escribiendo el texto adaptado...");
    const doc = await generarTexto(reglas);
    const resumen = (doc.texto||[]).map(b=>b.contenido).join(" ").slice(0,2000) || contenidoFuente().slice(0,2000);

    paso("Buscando el vocabulario clave...");
    doc.vocabulario = await generarVocabulario(reglas, resumen);

    doc.actividades = []; doc.rutas = null;
    if(!S.soloTranscribir && S.actividades.length){
      for(const act of S.actividades){
        paso("Armando "+byId(TIPOS_ACT,act.tipo).nom.toLowerCase()+"...");
        doc.actividades.push(await generarActividadTipo(reglas, resumen, act));
      }
      if(S.rutas){ paso("Armando las tres rutas..."); doc.rutas = await generarRutas(reglas, resumen); }
    }
    if(S.pictos){ paso("Buscando pictogramas de apoyo..."); await buscarPictogramas(doc); }
    clearInterval(timer); S.doc = doc; renderDoc(); go("scDoc");
  }catch(e){
    clearInterval(timer);
    $("scLoad").innerHTML = '<div class="card"><h2>No se pudo generar una parte del material</h2>'+
      '<p>'+esc(e.message)+'</p>'+
      '<div class="row"><button class="btn" onclick="generar()">Probar de nuevo</button>'+
      '<button class="btn quiet" onclick="renderWizard();go(\'scWizard\')">Volver a la configuración</button></div></div>';
  }
}

/* ARASAAC quedó descartado: su búsqueda por palabra clave puede traer un
   pictograma totalmente desubicado (ej. "celda" trayendo un ícono de silla
   de ruedas). Ahora el vocabulario usa la misma ilustración real que las
   actividades — una sola fuente de calidad en todo el documento. */
async function buscarPictogramas(doc){
  const voc = doc.vocabulario||[];
  for(const v of voc){
    v.img = pictoRayuela(v.palabra||v.picto||""); v.fuente = "rayuela"; /* respaldo inmediato */
    const escena = "Un solo objeto claramente identificable: "+(v.palabra||v.picto||"")+
      ". "+(v.significado||"")+" Ilustración de una sola cosa, sin texto, sin escena de fondo compleja.";
    const real = await generarIlustracionParaActividad(escena);
    if(real){ v.img = real; v.fuente = "ilustracion"; }
  }
}

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click();

function cargarJSZip(){
  if(window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise((ok,fail)=>{
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    s.onload = ()=> window.JSZip ? ok(window.JSZip) : fail(new Error("sin jszip"));
    s.onerror = ()=> fail(new Error("sin jszip"));
    document.head.appendChild(s);
    setTimeout(()=>{ if(!window.JSZip) fail(new Error("sin jszip")); },9000);
  });
}

/* --- piezas de OOXML --- */
function P(txt,o){
  o = o||{}; const m = medidas();
  const sz = o.size||m.base;
  const bdr = o.linea ? '<w:pBdr><w:bottom w:val="dotted" w:sz="8" w:space="2" w:color="B9B3C4"/></w:pBdr>' : '';
  const ppr = '<w:pPr>'+bdr+'<w:spacing w:line="'+m.line+'" w:lineRule="auto" w:after="'+(o.after==null?140:o.after)+'"/>'+
    (o.ind?'<w:ind w:left="'+o.ind+'"/>':'')+'<w:jc w:val="left"/></w:pPr>';
  if(!txt) return '<w:p>'+ppr+'</w:p>';
  const rpr = '<w:rPr><w:rFonts w:ascii="Verdana" w:hAnsi="Verdana"/><w:sz w:val="'+sz+'"/><w:szCs w:val="'+sz+'"/>'+
    (o.bold?'<w:b/>':'')+(o.color?'<w:color w:val="'+o.color+'"/>':'')+'<w:spacing w:val="4"/></w:rPr>';
  return '<w:p>'+ppr+'<w:r>'+rpr+'<w:t xml:space="preserve">'+XE(txt)+'</w:t></w:r></w:p>';
}

/* La parte mecánica (casilleros, uniones, tildes, tabla) SIEMPRE se arma en
   texto/tabla nativo de Word, nunca como imagen: es la parte que tiene que
   funcionar sí o sí, sin depender de que una ilustración se haya podido
   generar. La ilustración real (si existe) ya se insertó arriba, aparte. */
function tablaSimple(filas){ // [[celda1,celda2], ...] -> tabla de 2 columnas
  const tr = filas.map(f=>
    '<w:tr>'+f.map(c=>
      '<w:tc><w:tcPr><w:tcBorders><w:top w:val="single" w:sz="4" w:color="E3D9C9"/>'+
      '<w:bottom w:val="single" w:sz="4" w:color="E3D9C9"/><w:left w:val="single" w:sz="4" w:color="E3D9C9"/>'+
      '<w:right w:val="single" w:sz="4" w:color="E3D9C9"/></w:tcBorders></w:tcPr>'+
      P(c,{after:0})+'</w:tc>').join("")+'</w:tr>').join("");
  return '<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblLayout w:type="fixed"/></w:tblPr>'+
    '<w:tblGrid><w:gridCol w:w="4500"/><w:gridCol w:w="4500"/></w:tblGrid>'+tr+'</w:tbl><w:p/>';
}
function mecanicaDocx(a,col,m){
  const its = a.items||[];
  let x = "";
  switch(a.plantilla){
    case "opcion-visual":
      its.forEach((it,j)=>{
        x += P((j+1)+") "+(it.enunciado||""),{ind:280,after:60});
        const ops=(it.opciones&&it.opciones.length)?it.opciones:["Verdadero","Falso"];
        ops.forEach(o=> x += P("◯  "+o,{ind:620,after:50}));
        x += P("",{after:60});
      });
      break;
    case "unir-con-flechas":
      x += tablaSimple(its.map(it=>[String(it.enunciado||""), String(it.par||it.respuesta||"")]));
      break;
    case "completar-con-apoyo":
      if(a.banco&&a.banco.length) x += P("Palabras para usar: "+a.banco.join(" · "),{after:120,ind:280});
      its.forEach((it,j)=> x += P((j+1)+") "+String(it.enunciado||"").replace(/_+/g,"__________"),{ind:280,after:100}));
      break;
    case "secuencia-para-ordenar":
      its.forEach((it,j)=> x += P("[     ]   "+(it.enunciado||""),{ind:280,after:100}));
      break;
    case "clasificar-tabla":
      x += P((a.columnaA||"Sí")+"   /   "+(a.columnaB||"No"),{bold:true,color:col,after:80,ind:280});
      x += P(its.map(it=>it.enunciado).filter(Boolean).join("   ·   "),{ind:280,after:100});
      break;
    case "conteo-clipart":
      its.forEach(()=>{
        x += P("Contá los objetos de la ilustración y escribí cuántos hay:",{ind:280,after:60});
        x += P("",{linea:true,after:160,ind:280});
      });
      break;
    case "trazado-grande":{
      const it = its[0]||{};
      x += P(String(it.letra||"").toUpperCase(),{bold:true,size:(m.base+120),color:col,after:80});
      x += P("Trazá sobre la letra o número, empezando desde arriba.",{after:120});
      break;
    }
    case "operacion-con-conteo":
      its.forEach(it=>{
        const s = (it.signo==="-")?"−":"+";
        x += P((it.cantidad||"")+" "+s+" "+(it.cantidad2||"")+" = ______",{size:m.base+6,after:120,ind:280});
      });
      break;
    case "constelacion-puntos":
      its.forEach(it=> x += P((it.cantidad||"")+" + "+(it.cantidad2||"")+" = ______",{size:m.base+6,after:120,ind:280}));
      break;
    case "arreglo-multiplicativo":
      its.forEach(it=> x += P((it.filas||"")+" × "+(it.columnas||"")+" = ______",{size:m.base+6,after:120,ind:280}));
      break;
    case "texto-enmarcado":
      its.forEach(it=> x += P(it.enunciado||"",{after:160,ind:280}));
      break;
    case "marco-dibujo":
      its.forEach((it,j)=>{
        x += P((j+1)+") "+(it.enunciado||""),{ind:280,after:60});
        x += P("",{after:60}); x += P("",{after:60}); x += P("",{linea:true,after:200,ind:280});
      });
      break;
    default:
      its.forEach((it,j)=>{
        x += P((j+1)+") "+(it.enunciado||""),{ind:280,after:60});
        const n = a.tipo==="escritura"?4:2;
        for(let k=0;k<n;k++) x += P("",{linea:true,after:120,ind:280});
      });
  }
  return x;
}

  }
  if(S.notaDocente&&d.docente){

  }
  if(S.sourceImages && S.sourceImages.length && imgsOrigen && imgsOrigen.length){

    imgsOrigen.forEach(g=> x += imgP(g.rid, 500+g.i, g.cx, g.cy));

async function traerImagenes(){
  const voc = (S.doc&&S.doc.vocabulario)||[]; const out = [];
  for(let i=0;i<voc.length;i++){
    const u = voc[i].img||"";
    if(!/^(https?:|data:image\/(png|jpe?g))/.test(u)) continue; /* el SVG de respaldo no se puede incrustar así en Word */
    try{
      const r = await fetch(u); if(!r.ok) continue;
      const ext = /\.jpe?g(\?|$)/i.test(u) || /^data:image\/jpe?g/i.test(u) ? "jpeg" : "png";
      out.push({i, buf: await r.arrayBuffer(), rid:"rId"+(100+i), ext});
    }catch(e){}
  }
  return out;
}
/* Convierte una plantilla SVG en PNG para poder incrustarla en el Word.
   Se dibuja al doble de tamaño para que no se vea pixelada al imprimir. */
/* Lee el ancho/alto real de una imagen (para no deformarla en el Word) sin
   pasar por canvas — canvas.toBlob() es lo que fallaba en este sandbox. */
function dimensionesImagen(dataUrl){
  return new Promise((ok,fail)=>{
    const img = new Image();
    img.onload = ()=> ok({w:img.naturalWidth||1024, h:img.naturalHeight||1024});
    img.onerror = ()=> fail(new Error("no se pudo leer la imagen"));
    img.src = dataUrl;
  });
}
/* Ancho de una ilustración de actividad en el Word: ~10 cm */
const ANCHO_ILUSTRACION = 3600000;
async function imagenesActividadesReales(){
  const acts = (S.doc&&S.doc.actividades)||[], out = [];
  for(let i=0;i<acts.length;i++){
    const url = acts[i].img;
    if(!url) continue;
    try{
      const dim = await dimensionesImagen(url);
      const buf = await (await fetch(url)).arrayBuffer(); // fetch de un data: URL, no sale a internet
      const cy = Math.round(ANCHO_ILUSTRACION * (dim.h/dim.w));
      out.push({i, buf, rid:"rId"+(300+i), cx:ANCHO_ILUSTRACION, cy});
    }catch(e){ /* sin ilustración real, esa actividad sale solo con la parte mecánica */ }
  }
  return out;
}
/* Las imágenes del material original importado (Word/PDF/foto), incrustadas
   tal cual al final del Word para que no se pierdan al adaptar el contenido. */
async function imagenesOrigenReales(){
  const imgs = S.sourceImages||[], out = [];
  for(let i=0;i<imgs.length;i++){
    try{
      const dim = await dimensionesImagen(imgs[i].data);
      const buf = await (await fetch(imgs[i].data)).arrayBuffer();
      const cy = Math.round(ANCHO_ILUSTRACION * (dim.h/dim.w));
      out.push({i, buf, rid:"rId"+(500+i), cx:ANCHO_ILUSTRACION, cy});
    }catch(e){}
  }
  return out;
}
async function descargarWord(){
  estado("Armando el archivo de Word...");
  try{
    const JSZ = await cargarJSZip();
    const imgs = await traerImagenes();
    estado("Preparando las ilustraciones...");
    const imgsAct = await imagenesActividadesReales();
    const imgsOrigen = await imagenesOrigenReales();
    const zip = new JSZ();
    /* Extensión correcta también para jpeg de origen (además de png) */
    zip.file("[Content_Types].xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Default Extension="png" ContentType="image/png"/>'+
      '<Default Extension="jpeg" ContentType="image/jpeg"/>'+
      '<Default Extension="jpg" ContentType="image/jpeg"/>'+
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'+
      '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'+
      '</Types>');
    zip.folder("_rels").file(".rels",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'+
      '</Relationships>');
    const m = medidas();
    zip.folder("word").file("styles.xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'+
      '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Verdana" w:hAnsi="Verdana" w:cs="Verdana"/>'+
      '<w:sz w:val="'+m.base+'"/><w:szCs w:val="'+m.base+'"/></w:rPr></w:rPrDefault>'+
      '<w:pPrDefault><w:pPr><w:spacing w:line="'+m.line+'" w:lineRule="auto" w:after="140"/><w:jc w:val="left"/></w:pPr></w:pPrDefault>'+
      '</w:docDefaults>'+
      '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>'+
      '</w:styles>');
    let rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>';
    imgs.forEach(g=>{
      zip.folder("word").folder("media").file("picto"+g.i+"."+g.ext, g.buf);
      rels += '<Relationship Id="'+g.rid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/picto'+g.i+'.'+g.ext+'"/>';
    });
    imgsAct.forEach(g=>{
      zip.folder("word").folder("media").file("act"+g.i+".png", g.buf);
      rels += '<Relationship Id="'+g.rid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/act'+g.i+'.png"/>';
    });
    imgsOrigen.forEach(g=>{
      const ext = /^data:image\/jpe?g/i.test((S.sourceImages[g.i]||{}).data||"") ? "jpeg" : "png";
      zip.folder("word").folder("media").file("origen"+g.i+"."+ext, g.buf);
      rels += '<Relationship Id="'+g.rid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/origen'+g.i+'.'+ext+'"/>';
    });
    zip.folder("word").folder("_rels").file("document.xml.rels", rels+'</Relationships>');
    zip.folder("word").file("document.xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" '+
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" '+
      'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" '+
      'xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" '+
      'xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">'+
      '<w:body>'+cuerpoDocx(imgs, imgsAct, imgsOrigen)+
      '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>'+
      '<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/>'+
      '</w:sectPr></w:body></w:document>');
    const blob = await zip.generateAsync({type:"blob",
      mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    bajar(blob, nombreArchivo()+".docx");
    estado("Listo: se descargó el archivo .docx. Abrilo con Word para editarlo.");
  }catch(e){
    estado("Se descargó una versión compatible con Word (.doc). Al abrirla, guardala como .docx si querés.");
    bajarDocHTML();
  }
}
function bajarDocHTML(){
  const m = medidas(), col = "#"+m.col;
  const pt = S.tamano==="muy"?"23pt":(S.tamano==="grande"?"19pt":"14pt");
  const lh = S.interlineado==="amplio"?"190%":"150%";
  const cont = $("docBody") ? $("docBody").innerHTML : "";
  const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'+
    '<head><meta charset="utf-8"><title>Rayuela</title>'+
    '<style>@page{size:A4;margin:2cm}body{font-family:Verdana,Arial,sans-serif;font-size:'+pt+';line-height:'+lh+';color:#2E2A45;text-align:left;letter-spacing:.2pt}'+
    'h2,h3{font-family:Verdana,Arial,sans-serif;color:'+col+'}img{max-width:2.2cm}.exline{border-bottom:1px dotted #999;height:1.1em}</style></head><body>'+
    cont+'</body></html>';
  bajar(new Blob(["\ufeff"+html],{type:"application/msword"}), nombreArchivo()+".doc");
}
